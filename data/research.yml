# Papers under review and in progress. Titles are deliberately not shown.
in_progress:
  - id: misq-variability
    authors: [Reza Alibakhshi, Shirish C. Srivastava, Sunil Mithas]
    stage: review
    status: Third-round major revision
    venue: MIS Quarterly
    short: Emotional variability in video ads
    summary: >-
      Video ads rarely hold a single emotional tone. This paper theorizes
      emotional variability, the extent to which the emotions a video ad
      expresses change over its course, and examines how it relates to
      viewership and user engagement.
  - id: isr-arcs
    authors: [Reza Alibakhshi, Haris Krijestorac, Shirish C. Srivastava]
    stage: review
    status: Second-round major revision
    venue: Information Systems Research
    short: Emotional arcs in short-form video
    summary: >-
      Short-form videos follow emotional arcs that rise and fall within
      seconds. This paper examines how the shape of a video’s emotional arc
      relates to engagement at successive stages, from capturing attention to
      prompting action.
  - id: jais-nft
    authors: [Reza Alibakhshi, Shirish C. Srivastava, Olivier Chatain]
    stage: review
    status: First-round review
    venue: Journal of the Association for Information Systems
    short: NFTs as creator monetization
    summary: >-
      Free social media platforms increasingly offer creators direct ways to
      earn money from their content. Using the introduction of non-fungible
      tokens (NFTs) as a direct monetization mechanism, this paper examines
      how monetization changes content creation on the platform.
  - id: misq-ai-failures
    authors: [Anuragini Shirish, Reza Alibakhshi, Shirish C. Srivastava]
    stage: review
    status: First-round review
    venue: MIS Quarterly, special issue on ethics, regulation and policy
    short: Institutional responses to AI hallucinations
    summary: >-
      AI hallucinations, outputs that are fluent and confident yet false,
      have begun to surface in legal practice. This paper examines how
      institutions respond to such failures and what those responses imply
      for governing AI-mediated work.
  - id: jmis-temporal
    authors: [Reza Alibakhshi, Shirish C. Srivastava]
    stage: preparing
    status: Target journal
    venue: Journal of Management Information Systems
    short: Emotional variation across influencer posts
    summary: >-
      Followers experience an influencer’s posts as a sequence over time.
      This paper examines how temporal variation in the emotions expressed
      across those posts relates to follower engagement in
      influencer-centered communities.
  - id: wp-nft-creativity
    authors: [Haris Krijestorac, Reza Alibakhshi, Shirish C. Srivastava]
    stage: working
    status: Data analysis
    venue: ""
    short: Creativity and delayed rewards in the NFT market
    summary: >-
      Using data from the NFT art market, this project examines whether the
      market rewards creativity immediately or only after a delay.
  - id: wp-genai-value
    authors: [Reza Alibakhshi, Dominik Gutt]
    stage: working
    status: Early draft
    venue: ""
    short: Generative AI and the value of human creative work
    summary: >-
      This project studies how visual generative AI affects the valuation of
      human creative work.

