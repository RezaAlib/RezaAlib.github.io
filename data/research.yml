# Papers under review and in progress. Titles are deliberately not shown.
in_progress:
  - id: misq-variability
    authors: [Reza Alibakhshi, Shirish C. Srivastava, Sunil Mithas]
    stage: review
    status: Third-round major revision
    venue: MIS Quarterly
    short: Emotional variability in video ads
    summary: >-
      Video ads rarely hold a single emotional tone from start to finish.
      This paper examines how variability in the emotions a video ad
      expresses over its course relates to viewership and to user engagement.
  - id: isr-arcs
    authors: [Reza Alibakhshi, Haris Krijestorac, Shirish C. Srivastava]
    stage: review
    status: Second-round major revision
    venue: Information Systems Research
    short: Emotional arcs in short-form video
    summary: >-
      A short-form video unfolds as an emotional arc that rises and falls
      within seconds. This paper traces how the shape of that arc relates to
      engagement, from first capturing a viewer’s attention to prompting them
      to act.
  - id: jais-nft
    authors: [Reza Alibakhshi, Shirish C. Srivastava, Olivier Chatain]
    stage: review
    status: Under first-round review
    venue: Journal of the Association for Information Systems
    short: NFTs as creator monetization
    summary: >-
      Free social media platforms have started to give creators direct ways
      to earn money from their content. Using the introduction of
      non-fungible tokens (NFTs) as a monetization mechanism, this paper
      examines how the arrival of money changes content creation on a
      platform.
  - id: misq-ai-failures
    authors: [Anuragini Shirish, Reza Alibakhshi, Shirish C. Srivastava]
    stage: review
    status: Under first-round review
    venue: MIS Quarterly, special issue on ethics, regulation and policy
    short: Institutional responses to AI hallucinations
    summary: >-
      AI hallucinations, outputs that are fluent and confident but false,
      have begun to surface in legal practice. This paper examines how
      institutions respond to these failures and what their responses imply
      for governing work that is mediated by AI.
  - id: jmis-temporal
    authors: [Reza Alibakhshi, Shirish C. Srivastava]
    stage: preparing
    status: In preparation for submission
    venue: Journal of Management Information Systems
    short: Emotional variation across influencer posts
    summary: >-
      Followers of an influencer experience a stream of posts over time
      rather than one post in isolation. This paper examines how temporal
      variation in the emotions expressed across an influencer’s posts
      relates to engagement in influencer-centered communities.
  - id: wp-nft-creativity
    authors: [Haris Krijestorac, Reza Alibakhshi, Shirish C. Srivastava]
    stage: working
    status: Data analysis
    venue: ""
    short: Creativity and delayed rewards in the NFT market
    summary: >-
      Using data from the NFT art market, this project asks whether creative
      work is rewarded immediately or whether its rewards arrive with a delay.
  - id: wp-genai-value
    authors: [Reza Alibakhshi, Dominik Gutt]
    stage: working
    status: Draft in preparation
    venue: ""
    short: Generative AI and the value of human creative work
    summary: >-
      As visual generative AI spreads, this project studies how it affects
      the valuation of creative work made by people.

